services:
  redis:
    image: redis:8.10-alpine
    # In-memory only: game state is short-lived by design (no persistence)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 3

  app:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/intothefray", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3
