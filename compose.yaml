services:
  redis:
    image: redis:8.10-alpine
    # In-memory only: game state is short-lived by design (no persistence)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 3
