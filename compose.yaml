services:
  redis:
    image: redis:8.10-alpine
    # In-memory only: game state is short-lived by design (no persistence)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 3

  app:
    build: .
    restart: on-failure
    ports:
      - "${PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/intothefray", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # The browser reaches the server on its host port
        VITE_API_URL: http://localhost:${PORT:-8080}
    restart: on-failure
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 10s
      retries: 3
