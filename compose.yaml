services:
  redis:
    image: redis:8.10-alpine
    # In-memory only: game state is short-lived by design (no persistence)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 3

  app:
    build: .
    restart: on-failure
    ports:
      - "${PORT:-9000}:9000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/intothefray", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3

  web:
    # The Caddy version is pinned here only: the web app has no Dockerfile
    image: caddy:2.11.7-alpine
    restart: on-failure
    # Unprivileged: the Caddyfile disables the admin API and config autosave,
    # so nothing needs a writable home
    user: "65534:65534"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./web/dist:/srv:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      # `make infra-up` points it to the server running on the host
      API_UPSTREAM: ${API_UPSTREAM:-app:9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 10s
      retries: 3
