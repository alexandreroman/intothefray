name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main all
# finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go build ./... also compiles the commands make build leaves out
      # (cmd/packgen).
      - name: Build
        run: |
          go build ./...
          make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

      # Matches the local golangci-lint and the version "2" of .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    steps:
      # The full checkout is needed: the web build copies ../packs/dist.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs node and pnpm as pinned in the root mise.toml, and caches them.
      - uses: jdx/mise-action@v5

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: web
        run: pnpm check

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Test
        working-directory: web
        run: pnpm test

      # No VITE_API_URL: the app then calls the API on its own origin.
      - name: Build
        working-directory: web
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Same platform as the published image, so both jobs share the gha cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose.yaml
        run: docker compose config --quiet

      # Runs in the compose web service so that the Caddy version stays pinned
      # in compose.yaml only. web/dist must exist for its bind mount.
      - name: Validate the Caddyfile
        run: |
          mkdir -p web/dist
          docker compose run --rm --no-deps -T web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Publishes the image only once every check of the commit has passed.
  publish:
    needs: [go, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default gha cache scope reuses the layers the docker job built.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexandreroman/intothefray:${{ github.sha }}
            ghcr.io/alexandreroman/intothefray:main
          labels: org.opencontainers.image.source=https://github.com/alexandreroman/intothefray
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The frontend goes out once its image exists. A called workflow gets no more
  # permissions than its caller grants, so this covers its build and deploy jobs.
  pages:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  deploy-backend:
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # GITHUB_TOKEN cannot dispatch to another repository, hence a fine-grained
      # PAT scoped to intothefray-infra. Without it (a fork), the step only warns.
      - name: Trigger the backend deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN is not set: the backend is not deployed"
            exit 0
          fi
          # -f sends the SHA as a raw string; -F could coerce it.
          gh api repos/alexandreroman/intothefray-infra/dispatches \
            -f event_type=deploy-app \
            -f "client_payload[sha]=$SHA"
