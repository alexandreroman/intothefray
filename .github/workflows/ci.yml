name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main all
# finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go build ./... also compiles the commands make build leaves out
      # (cmd/packgen).
      - name: Build
        run: |
          go build ./...
          make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

      # Matches the local golangci-lint and the version "2" of .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    steps:
      # The full checkout is needed: the web build copies ../packs/dist.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs node and pnpm as pinned in the root mise.toml, and caches them.
      - uses: jdx/mise-action@v5

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: web
        run: pnpm check

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Test
        working-directory: web
        run: pnpm test

      # No VITE_API_URL: the app then calls the API on its own origin.
      - name: Build
        working-directory: web
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose.yaml
        run: docker compose config --quiet

      # Runs in the compose web service so that the Caddy version stays pinned
      # in compose.yaml only. web/dist must exist for its bind mount.
      - name: Validate the Caddyfile
        run: |
          mkdir -p web/dist
          docker compose run --rm --no-deps -T web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
