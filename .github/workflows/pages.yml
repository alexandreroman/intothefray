name: Pages

# The infra repository dispatches backend-deployed once the backend of a commit
# is live, so the frontend never goes out ahead of its API.
on:
  repository_dispatch:
    types: [backend-deployed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer deployment supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site settings to find its base path.
      pages: read
    steps:
      # The full checkout is needed: the web build copies ../packs/dist.
      - uses: actions/checkout@v7
        with:
          # The dispatched commit, else the ref of the manual run.
          ref: ${{ github.event.client_payload.sha || github.sha }}
          persist-credentials: false

      # Installs node and pnpm as pinned in the root mise.toml, and caches them.
      - uses: jdx/mise-action@v5

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Verify
        working-directory: web
        run: pnpm check && pnpm lint && pnpm test

      # The site's base path: "/<repo>" for a project site, empty at the domain
      # root (custom domain or user/organisation site).
      - id: pages
        uses: actions/configure-pages@v6

      # An unset variable would ship relative API URLs, which hit the GitHub
      # Pages origin where no API runs.
      - name: Build
        working-directory: web
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::The API_URL repository variable is not set"
            exit 1
          fi
          pnpm build --base "$BASE_PATH/"
          # Pages has no rewrite: its 404 page serves the SPA for deep links.
          cp dist/index.html dist/404.html
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
