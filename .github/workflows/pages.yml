name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full checkout is needed: the web build copies ../packs/dist.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs node and pnpm as pinned in the root mise.toml, and caches them.
      - uses: jdx/mise-action@v5

      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Verify
        working-directory: web
        run: pnpm check && pnpm lint && pnpm test

      # An unset variable would silently ship a frontend aimed at localhost.
      - name: Build
        working-directory: web
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::The API_URL repository variable is not set"
            exit 1
          fi
          pnpm build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
