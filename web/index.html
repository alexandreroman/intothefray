<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D111B" />
    <title>Into the Fray</title>
    <!-- The opaque ICO for browsers without SVG icons; sized 32x32, it leaves the others on the SVG. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- Added to the home screen, a game runs full screen: iOS has no Fullscreen API. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      The page runs under the status bar and pads by the top safe area: with "black", iPadOS 27 draws
      the status bar over the page all the same, and reports no top safe area to keep clear of it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://img.intothefray.xyz" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <!-- Shown only without JavaScript. The text is the home page's description (src/lib/pages.ts). -->
      <noscript>
        <h1>Into the Fray</h1>
        <p>
          Play Marvel Champions in your browser, solo or with up to three friends. A free sandbox
          card table: no account, nothing to install. An unofficial fan project.
        </p>
        <p>Turn on JavaScript to play.</p>
        <p>Fan-made and unofficial. Not affiliated with Marvel or Fantasy Flight Games.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
